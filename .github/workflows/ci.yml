name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Kit tests
        run: swift test --package-path SamsungTVKit
