name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kit-tests:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Kit tests
        run: swift test --package-path SamsungTVKit

  # Unit and UI tests run as separate jobs in parallel; the UI tests take most of the time.
  app-tests:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            only: FreeRemoteTests
          - suite: ui
            only: FreeRemoteUITests
    name: app-tests (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Build for device (unsigned)
        if: matrix.suite == 'unit'
        run: >
          xcodebuild build -project FreeRemote.xcodeproj -scheme FreeRemote
          -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO
      - name: Pick newest iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          # Runtime keys look like com.apple.CoreSimulator.SimRuntime.iOS-27-0, sometimes with a suffix.
          def version(k):
              m = re.search(r"\.iOS-(\d+)-(\d+)", k)
              return (int(m[1]), int(m[2])) if m else None
          # Prefer the model the project is tested on (iPhone 17 Pro), then any "iPhone NN Pro", then any
          # iPhone; newer runtimes break ties. Unusual models (e.g. foldables) launch apps unreliably.
          def rank(d):
              n = d["name"]
              return 0 if n == "iPhone 17 Pro" else 1 if re.fullmatch(r"iPhone \d+ Pro", n) else 2
          phones = [(rank(d), tuple(-v for v in version(k)), d["udid"])
                    for k in runtimes if version(k) for d in runtimes[k] if d["name"].startswith("iPhone")]
          print(min(phones)[2])')
          xcrun simctl list devices | grep "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      # Simulator builds are ad-hoc signed without a team; CODE_SIGNING_ALLOWED=NO would strip the
      # entitlements the keychain needs, so it is only used for the device build above.
      - name: App ${{ matrix.suite }} tests
        run: >
          xcodebuild test -project FreeRemote.xcodeproj -scheme FreeRemote
          -destination "id=$SIM_UDID"
          -only-testing:${{ matrix.only }}
          -parallel-testing-enabled NO
          -retry-tests-on-failure -test-iterations 2
